<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Products | Coffee Club Running</title>
    <meta name="description" content="Shop Coffee Club Running products.">
    <link rel="icon" href="assets/cc-icon2.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header" id="top">
      <a class="brand" href="index.html" aria-label="Coffee Club home">
        <img src="assets/cc-icon2.png" alt="Coffee Club logo">
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span></span>
        <span></span>
        <span></span>
        <span class="sr-only">Menu</span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="shop.html">Shop</a>
        <a href="events.html">Events</a>
        <a href="index.html#meet">Meet us</a>
        <a href="index.html#about">About</a>
        <a href="index.html#faq">FAQ</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <p class="eyebrow">Home / All Products</p>
        <h1>All Products</h1>
        <p>1 product</p>
      </section>

      <section class="shop-layout section">
        <aside class="filters" aria-label="Shop filters">
          <h2>Browse by</h2>
          <a href="shop.html">All Products</a>
          <h2>Filter by</h2>
          <p>Size</p>
          <label><input type="checkbox"> Large</label>
          <label><input type="checkbox"> Medium</label>
          <label><input type="checkbox"> Small</label>
        </aside>
        <article class="product-card">
          <img src="assets/sweatshirt.png" alt="Tie-dye Coffee Club sweatshirt">
          <div>
            <p class="eyebrow">Recommended</p>
            <h2>Tie-dye Coffee Club Sweatshirt</h2>
            <p class="price">$60.00</p>
          </div>
        </article>
      </section>

      <section class="contact" id="contact">
        <div>
          <p class="eyebrow">Contact us</p>
          <h2>Manhattan Beach, CA</h2>
          <a href="mailto:southbaycoffeeclub@gmail.com">southbaycoffeeclub@gmail.com</a>
        </div>
        <a class="instagram-button" href="https://www.instagram.com/sbcoffeeclub/" target="_blank" rel="noreferrer">
          <img src="assets/instagram.png" alt="" aria-hidden="true">
          Follow us
        </a>
      </section>
    </main>

    <footer class="site-footer">
      <p>South Bay Coffee Club &copy; 2021</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
